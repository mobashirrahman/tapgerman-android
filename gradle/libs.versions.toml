# Every version the build resolves, and why it is that version.
#
# The redesign is the only thing in this project that touches these numbers, and
# the reason each one is pinned is not obvious from the number alone, so it is
# written down here rather than scattered across two build files.

[versions]
# --- Toolchain ---------------------------------------------------------------
# compose-bom 2026.06.00 resolves core Compose 1.11.3 + material3 1.4.0, and is
# the newest BOM that still builds against compileSdk 36 on AGP 8. From
# compose-bom 2026.08.00 the graph moves to Compose 1.12, which requires
# compileSdk 37 *and* AGP 9, and AGP 9 means dropping the
# org.jetbrains.kotlin.android plugin for AGP's built-in Kotlin, new DSL
# interfaces and changed Gradle property defaults. That is a toolchain migration
# wearing a dependency-bump hat, so this project stays on 8.x.
agp = "8.13.2"
kotlin = "2.3.21"
# AGP 8.13 needs Gradle 8.13 or newer; 8.14.5 is the newest 8.14 patch.
gradle = "8.14.5"

compileSdk = "36"
targetSdk = "36"
minSdk = "26"

# --- Compose -----------------------------------------------------------------
composeBom = "2026.06.00"

# Material 3 Expressive is not reachable from a stable release.
#
# Verified against the published sources rather than the bytecode: in material3 1.4.0 both
# `MotionScheme` and `MaterialExpressiveTheme` are declared `internal`, and the Expressive
# components (LoadingIndicator, ContainedLoadingIndicator, ButtonGroup, SplitButton,
# FloatingToolbar, WavyProgressIndicator) do not exist at all. They first appear in 1.5.0-alpha,
# and every 1.5.0 alpha declares minCompileSdk 37 / minAGP 9.1, which drags the graph to
# Compose 1.12 and forces the AGP 9 migration this project is deliberately not doing.
#
# So the expressive layer is built here instead. The tokens it would have supplied are the parts
# that are easy to own anyway: ui/theme/Shape.kt holds the round shape scale, Motion.kt holds the
# springs, and ui/components/Expressive.kt holds the four components worth having. Nothing is lost
# visually; what is lost is provenance.
#
# Revisit when material3 1.5.0+ goes stable and a BOM can carry it. That is the moment to
# re-export the library versions of those four composables and delete ui/components/Expressive.kt.
material3 = "1.4.0"

# --- AndroidX ----------------------------------------------------------------
coreKtx = "1.17.0"
# SplashScreen compat for API 26..30; API 31+ uses the platform implementation.
splashscreen = "1.0.1"
activityCompose = "1.13.0"
lifecycle = "2.9.4"
datastore = "1.2.1"
androidxJunit = "1.3.0"

# --- Test --------------------------------------------------------------------
robolectric = "4.17"
roborazzi = "1.75.0"

# --- Third party -------------------------------------------------------------
# The only two runtime dependencies outside AndroidX. Jsoup parses shared
# article HTML; coroutines drive the network and parse work off the main thread.
jsoup = "1.18.3"
coroutines = "1.10.2"
# org.json ships inside Android; the standalone artifact makes it usable in JVM
# unit tests, which run against a stubbed android.jar.
json = "20240303"

junit = "4.13.2"
kotlinTest = "2.3.21"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-text = { module = "androidx.compose.ui:ui-text" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlinTest" }
json = { module = "org.json:json", version.ref = "json" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
